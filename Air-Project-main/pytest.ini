[pytest]
testpaths = tests
addopts = -ra -p no:cacheprovider
markers =
    slow: chạy pipeline đầy đủ hoặc notebook (mặc định vẫn chạy; bỏ bằng -m "not slow")
    notebook: chạy thật notebook trong một bản sao của dự án, mạng bị chặn (khoảng 4 phút; bỏ bằng -m "not notebook")
    network: cần mạng thật tới Open-Meteo; tự bỏ qua (skip) khi môi trường chặn, và khi đó KHÔNG được tính là đã kiểm API thật
